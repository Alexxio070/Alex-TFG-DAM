[project]
name = "linux-system-companion"
version = "0.1.0"
description = "Agente Python del Linux System Companion: API del PC y TUI companion"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "psutil",
    "textual",
    "qrcode",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
companion = "companion.tui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["companion*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
