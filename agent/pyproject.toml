[project]
name = "sysmote"
version = "0.1.0"
description = "Agente de Sysmote: administra tu PC Linux desde el móvil, con API protegida por login, TUI y túnel iroh"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Alexxio" }]
keywords = ["linux", "remote-administration", "monitoring", "tui", "fastapi", "iroh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.146",
    "uvicorn>=0.54",
    "psutil>=7.2",
    "textual>=8.2",
    "pydantic>=2.14",
    "qrcode>=8.2",
    "iroh>=1.2.0",
    "argon2-cffi>=25.1",
    "cryptography>=50.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "httpx2>=2.14", "ruff>=0.17"]

[project.urls]
Homepage = "https://github.com/Alexxio070/Alex-TFG-DAM"
Issues = "https://github.com/Alexxio070/Alex-TFG-DAM/issues"
Documentation = "https://github.com/Alexxio070/Alex-TFG-DAM/tree/main/doc"

[project.scripts]
sysmote = "sysmote.tui.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sysmote*"]

[tool.setuptools.package-data]
sysmote = ["schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
