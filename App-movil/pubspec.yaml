name: sysmote
description: "Cliente Flutter de Sysmote: administra en remoto el PC Linux del usuario desde el móvil."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.3
  xterm: ^4.0.0
  shared_preferences: ^2.5.6
  http: ^1.6.0
  iroh_flutter: ^1.3.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Fase 2 (12/11/2026): shared_preferences 2.5.6 + shared_preferences_android
# 2.5.0/2.5.5 lanzan NoSuchMethodError en SharedPreferencesApiRegistrar en
# dispositivo real (Android 15, MIUI). Se fija una pareja anterior conocida
# por estable mientras se confirma si es un fallo reciente de esos paquetes.
dependency_overrides:
  shared_preferences: 2.3.3
  shared_preferences_android: 2.3.4

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
