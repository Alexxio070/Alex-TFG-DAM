name: tfg
description: "Cliente Flutter de Linux System Companion: administra en remoto el PC Linux del usuario desde el móvil."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.3
  xterm: ^4.0.0
  shared_preferences: ^2.5.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
